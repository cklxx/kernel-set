name: Bug report
description: Report incorrect results, a crash, or a build/load failure
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please do **not** use this for security issues —
        see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code / commands. Include the op and inputs if numeric.
      render: shell
    validations:
      required: true
  - type: input
    id: which-op
    attributes:
      label: Operator / entry point
      description: e.g. ks_gemm, ks_rms_norm, dispatch.rms_norm, ksctl plan
  - type: input
    id: gpu
    attributes:
      label: GPU / arch
      description: e.g. L4 (sm_89), A100 (sm_80), H100 (sm_90), or "no GPU"
  - type: input
    id: version
    attributes:
      label: kernel-set version + how installed
      description: e.g. 0.2.1 from PyPI, or a commit SHA built from source
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
