# kernel-set model registry (human-readable mirror).
# registry.json is the source of truth; this script regenerates only this yaml mirror from it.
schema_version: 1
abi_header: include/kernel_set/kernel_set.h
logical_ops:
  - embedding
  - attn_norm
  - rope
  - attn_prefill
  - attn_decode
  - sparse_mla_attention
  - dsa_indexer_logits
  - dsa_topk_select
  - nsa_selection_attention
  - conv1d
  - ssm
  - mamba2_ssd_chunk_scan
  - gated_delta
  - linear_attn
  - rwkv_wkv
  - qkv_proj
  - o_proj
  - ffn_norm
  - mlp_gate_up
  - mlp_act
  - mlp_down
  - moe_gate
  - moe_grouped_gemm
  - lm_head
  - bitnet_gemm
  - sampling

training_ops:
  - attn_backward
  - cross_entropy
  - optimizer

op_descriptions:
  embedding: token embedding lookup
  attn_norm: pre-attention normalization
  rope: rotary position embedding
  attn_prefill: prefill / context attention (full sequence)
  attn_decode: autoregressive decode attention (paged KV)
  sparse_mla_attention: DeepSeek sparse MLA over selected KV indices
  dsa_indexer_logits: DeepSeek lightning-indexer attention logits
  dsa_topk_select: top-k KV-index selection for sparse attention
  nsa_selection_attention: Native Sparse Attention selection branch
  qkv_proj: fused Q/K/V projection GEMM
  o_proj: attention output projection GEMM
  ffn_norm: pre-MLP normalization
  mlp_gate_up: MLP up/gate projection GEMM (or MoE grouped GEMM)
  mlp_act: gated MLP activation (SwiGLU/GeGLU) or dense act
  mlp_down: MLP down projection GEMM (or MoE grouped GEMM)
  moe_gate: MoE router / gating
  moe_grouped_gemm: grouped per-expert GEMM
  lm_head: final logits projection
  sampling: token sampling / decode head
  attn_backward: attention backward (training)
  cross_entropy: fused (linear) cross-entropy loss (training)
  optimizer: fused optimizer step (training)
  conv1d: short causal depthwise conv1d mixer (Mamba/LFM2)
  ssm: selective state-space scan token-mixer (Mamba selective_scan)
  gated_delta: gated delta-rule linear attention (gated DeltaNet / KDA)
  linear_attn: gated linear attention (GLA / lightning / simple-GLA)
  rwkv_wkv: RWKV-7 WKV (free DPLR generalized delta rule)
  bitnet_gemm: BitNet W1.58A8 ternary BitLinear GEMM
  mamba2_ssd_chunk_scan: Mamba-2 SSD varlen chunk scan

