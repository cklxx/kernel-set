attention:
  - name: FlashAttention-4 (FA4)
    pip_install: "pip install flash-attn==4.0.0b16 --no-build-isolation"
    build_from_source: "CuTe-DSL kernels; prefer FA4 beta wheels, else build from source"
    import_check: "import flash_attn; assert flash_attn.__version__.startswith('4')"
    maps_to: [ks_flash_attn, ks_flash_attn_varlen, ks_flash_attn_backward]
    bench_category: attention
    gpu_arch_required: [sm100, sm90]
    blackwell_only: false
    hopper_only: false
    dtypes: [bf16, fp16, fp8_e4m3, fp8_e5m2]
