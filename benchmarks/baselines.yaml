# kernel-set external baselines — real upstream SOTA kernels to compare against.
#
# PURPOSE
#   This is the config that makes the bench "comprehensive": instead of only
#   comparing kernel-set vs a naive PyTorch reference, the harness installs the
#   real, current best-in-class kernel for each op and compares against it.
#
# SCOPE
#   2026 H1 high/medium-confidence libraries (see docs/KERNEL_LANDSCAPE_2026.md
#   for the sourced, human-readable catalog with versions, claims, source links).
#
# SCHEMA (per baseline entry)
#   name              display name (lib + op family)
#   pip_install       shell command(s) to install (null => build-from-source only)
#   build_from_source short note if pip is not the canonical path (else null)
#   import_check      python expr that must succeed to confirm the lib is usable
#   maps_to           kernel-set op(s) this baseline competes with (ks_* / bench category)
#   bench_category    bench.py op category bucket (attention/gemm/w8a8/w4a16/moe/...)
#   gpu_arch_required min/required SM archs; bench should SKIP (not error) otherwise
#   blackwell_only    true => needs sm100+ (datacenter Blackwell); skip on T4/L4/A100/Hopper
#   hopper_only       true => needs sm90 (WGMMA/TMA); skip on T4/L4/A100 and (mostly) consumer
#   dtypes            dtypes the baseline supports for this op
#   benchable         false => multi-GPU / comm-only, cannot be benched single-GPU here
#   confidence        high | medium  (from the research catalog)
#   notes             anything the harness/operator should know
#
# ARCH TOKENS: sm75(T4) sm80(A100) sm89(L4/4090) sm90(Hopper H100/H200/H800)
#              sm100/sm103(Blackwell DC: B200/GB200/GB300) sm120/sm121(consumer Blackwell/Spark/Thor)
#
# COLAB TARGETS are T4(sm75)/L4(sm89)/A100(sm80): every blackwell_only or
# hopper_only entry below will SKIP there — that is expected, not a failure.

schema_version: 1
generated: "2026-06-04"
catalog_doc: docs/KERNEL_LANDSCAPE_2026.md

