[package]
name = "kernel-set-example-rmsnorm"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Path to the in-tree Rust binding. When consuming kernel-set from elsewhere,
# replace this with a version or git dependency.
kernel-set = { path = "../../bindings/rust" }

[[bin]]
name = "rmsnorm"
path = "src/main.rs"
